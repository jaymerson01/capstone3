name: Publish the web app

# Publishes to GitHub Pages:
# - the resident app at https://jaymerson01.github.io/capstone3/, so iPhone
#   users can open it in Safari and add it to their Home Screen;
# - the admin portal at https://jaymerson01.github.io/capstone3/admin/
#   (only accounts with the admin role can sign in).
#
# The site is public, so it is built without the Gemini key (.env is left
# empty).
on:
  push:
    branches: [feature/neo-tactile-ui]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clean_folder
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Create an empty .env (no keys on a public site)
        run: touch .env

      - run: flutter pub get

      - name: Build the admin portal
        run: |
          flutter build web --release -t lib/main_admin.dart --base-href /capstone3/admin/
          mv build/web build/admin_site

      - name: Build the resident web app, with the admin portal under /admin/
        run: |
          flutter build web --release -t lib/main_resident.dart --base-href /capstone3/
          mv build/admin_site build/web/admin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: clean_folder/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
