name: Build Android APK

# Builds the resident app's APK on GitHub, so no Android SDK is needed on
# your computer. Download it from the run's "Artifacts" section.
#
# This repository is public, so the APK is built without the Gemini key
# (.env is left empty): anyone signed in to GitHub can download artifacts.
#
# The APK is signed with the permanent release key from the ANDROID_KEYSTORE_*
# secrets, so its SHA-1/SHA-256 always match Firebase and the Maps key.
on:
  push:
    branches: [feature/neo-tactile-ui]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clean_folder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Create an empty .env (no keys in a public build)
        run: touch .env

      - run: flutter pub get

      - name: Use the permanent release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets are missing, so the APK's SHA-1 wouldn't match Firebase."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build the resident app
        run: flutter build apk --release -t lib/main_resident.dart

      - name: Check the APK is signed with the permanent key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -E "SHA-1|SHA-256" | tee -a "$GITHUB_STEP_SUMMARY" | tee certs.txt
          grep -q "SHA-256 digest: 2c85110c50db4b248f5b612309f58eb52d7eee932de535f0c2a1ba1f64ca117e" certs.txt \
            || { echo "::error::The APK isn't signed with the permanent release key."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: resq-resident-apk
          path: clean_folder/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
