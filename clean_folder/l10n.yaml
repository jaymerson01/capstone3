# Flutter gen-l10n settings for the resident app's interface text.
# English (app_en.arb) is the template; every other language falls back to it
# for any string it doesn't translate yet.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
format: true
